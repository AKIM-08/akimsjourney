{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}

<link rel="icon" type="image/png" href="{{ favicon_path }}/favicon-light.png" sizes="96x96" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="{{ favicon_path }}/favicon-dark.png" sizes="96x96" media="(prefers-color-scheme: dark)">

<link rel="shortcut icon" href="{{ favicon_path }}/favicon-dark.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/favicon-dark.png">

<link rel="icon" type="image/svg+xml" href="{{ favicon_path }}/favicon.svg">

{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest">
{% endif %}
